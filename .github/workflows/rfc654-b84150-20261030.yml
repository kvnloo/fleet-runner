name: RFC654 pinned round-two substrate verification
run-name: rfc654-b84150-297-and-full
on:
  push:
    branches:
      - experiment/rfc654-b84150-avrea-20261030
permissions:
  contents: read
jobs:
  verify:
    name: verify-${{ matrix.slice }}
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slice: ['1/3', '2/3', '3/3']
    env:
      HERMES_TEST_WORKERS: '8'
      HERMES_TEST_FILE_TIMEOUT: '600'
      HERMES_TEST_FILE_RETRIES: '0'
    steps:
      - name: Checkout candidate at immutable SHA
        uses: actions/checkout@v4
        with:
          repository: c0wb0yp0tat0/hermes-agent
          ref: b84150e9be88911280f981467de9628fcfb0f60f
          persist-credentials: false
          submodules: recursive
      - name: Check source identity and battery manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rfc-out
          test "$(git rev-parse HEAD)" = "b84150e9be88911280f981467de9628fcfb0f60f"
          printf 'repo=c0wb0yp0tat0/hermes-agent\nsha=b84150e9be88911280f981467de9628fcfb0f60f\nslice=%s\n' '${{ matrix.slice }}' > rfc-out/source.txt
          sha256sum -c KVNLOO654-297-BATTERY-MANIFEST-20261030.sha256 | tee rfc-out/manifest-check.log
      - name: Build pinned Hermes test environment
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '["all","anthropic","bedrock","mistral","fal","modal","daytona","parallel-web","keychain"]'
          test-environment: 'true'
          cache: 'false'
      - name: Install verified ripgrep if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            RG_VERSION=15.1.0
            RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
            T="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
            curl -sSfL --retry 3 -o "$T.tar.gz" "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/$T.tar.gz"
            echo "$RG_SHA256  $T.tar.gz" | sha256sum -c -
            tar -xzf "$T.tar.gz"
            sudo mv "$T/rg" /usr/local/bin/rg
          fi
          rg --version | head -1
      - name: Run complete 297-case battery without selectors
        if: matrix.slice == '1/3'
        shell: bash
        env:
          HERMES_TEST_SLICE: ''
        run: |
          set +e
          scripts/run_tests.sh \
            tests/tools/test_rfc_homework.py \
            tests/tools/test_kvnloo654_fix01_cache_coherence.py \
            tests/tools/test_kvnloo654_fix02_bounded_pager.py \
            tests/tools/test_kvnloo654_fix03_schema_contract.py \
            tests/tools/test_kvnloo654_fix04_consent_deny.py \
            tests/tools/test_kvnloo654_fix05_fail_closed_gate.py \
            tests/tools/test_write_gate.py \
            tests/tools/test_memory_tool.py \
            tests/tools/test_memory_patch_action.py \
            tests/tools/test_memory_target_contract.py \
            tests/tools/test_write_approval.py \
            tests/tools/test_write_deny.py \
            tests/tools/test_threat_patterns.py \
            tests/tools/test_memory_tool_schema.py \
            tests/tools/test_memory_tool_import_fallback.py \
            -q --tb=short > rfc-out/battery-297.log 2>&1
          status=$?
          tail -n 35 rfc-out/battery-297.log
          printf '%s\n' "$status" > rfc-out/battery-297.exit
          exit 0
      - name: Canonical full Python suite
        shell: bash
        env:
          HERMES_TEST_SLICE: '${{ matrix.slice }}'
        run: |
          set -o pipefail
          scripts/run_tests.sh -q 2>&1 | tee rfc-out/full-suite.log
      - name: Enforce complete 297-case pass
        if: always() && matrix.slice == '1/3'
        shell: bash
        run: |
          test -f rfc-out/battery-297.exit
          test "$(cat rfc-out/battery-297.exit)" = '0'
      - name: Archive receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfc654-b84150-slice-${{ strategy.job-index }}
          path: rfc-out/
          retention-days: 7
          if-no-files-found: warn
